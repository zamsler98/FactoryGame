<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>FactoryGame</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <style>
        html, body, canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: #222; /* for contrast on mobile */
        }
        canvas {
            /* Let the game handle all touch gestures itself instead of the
               browser scrolling / pinch-zooming the page. */
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>
<canvas id="glcanvas" tabindex='1'></canvas>
<!-- Macroquad JS glue code (official CDN) -->
<script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
<script>load("factorygame.wasm");</script>
</body>
</html>
